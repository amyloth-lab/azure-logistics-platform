[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-api"
version = "0.1.0"
description = "Inventory and orders API for the logistics platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "azure-identity>=1.17,<2",
  "fastapi>=0.115,<1",
  "pyjwt[crypto]>=2.9,<3",
  "pydantic-settings>=2.4,<3",
  "pyodbc>=5.1,<6",
  "python-dotenv>=1.0,<2",
  "redis>=5,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0,<3",
  "msal>=1.31,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  "diagrams",
  "scripts/build_backlog_csv.py",
  ".venv",
  "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
